<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Glowing Neon Hexagon Background -->
  <polygon points="50 5, 90 25, 90 75, 50 95, 10 75, 10 25" fill="#050505" stroke="#00f0ff" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Inner Tech Ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.4" stroke-dasharray="4 4" />

  <!-- The Letters BT -->
  <text x="50" y="66" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="40" fill="#00f0ff" text-anchor="middle" letter-spacing="-2">BT</text>
  
  <!-- Accent Dots -->
  <circle cx="50" cy="15" r="2.5" fill="#ffffff" />
  <circle cx="50" cy="85" r="2.5" fill="#ffffff" />
</svg>